# Workflow pour déployer le dossier build sur GitHub Pages
name: Deploy to GitHub Pages

on:
  # Se déclenche sur les push vers la branche main
  push:
    branches:
      - main
  # Permet de lancer manuellement le workflow
  workflow_dispatch:

# Permissions pour le déploiement sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Empêche les déploiements simultanés
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
